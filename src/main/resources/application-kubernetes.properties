# src/main/resources/application-kubernetes.properties
# Новый профиль ТОЛЬКО для Kubernetes

spring.config.activate.on-profile=kubernetes

spring.application.name=UserService

# Database - PostgreSQL в Kubernetes
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://user-postgres-service:5432/us_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.schema=public
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/master-changelog.xml

# Redis - Ключевое изменение: имя хоста из Kubernetes Service!
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis-service}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# Отключить Docker Compose в Kubernetes
spring.docker.compose.enabled=false

# Server
server.port=8080

# JWT Configuration для валидации токенов от auth-service
# Должен совпадать с jwt.secret в authentication-service
jwt.secret=${JWT_SECRET:mySecretKeyForJWTGenerationInAuthenticationService2025}

# Authentication Service Configuration для синхронизации удаления пользователей
authentication.service.base-url=${AUTHENTICATION_SERVICE_BASE_URL:http://authentication-service:8081}
authentication.service.internal-api-key=${AUTHENTICATION_SERVICE_INTERNAL_API_KEY:dev-internal-api-key}

# Logging для отладки Spring Security
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
# Logging для нашего сервиса - INFO для видимости операций с БД
logging.level.com.innowise.demo=INFO

# Actuator для Kubernetes Probes
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.liveness-state.enabled=true
management.health.readiness-state.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.server.port=8080

